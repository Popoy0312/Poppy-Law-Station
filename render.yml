name: Render slide dari inbox

on:
  push:
    paths:
      - "inbox/*.txt"
      - "inbox/*.json"
      - "inbox/*.md"
  workflow_dispatch:         # tombol "Run workflow" untuk memproses file yang masih ada di inbox/

permissions:
  contents: write
  issues: write

concurrency:
  group: render-inbox
  cancel-in-progress: false

env:
  REPORT_DIR: /tmp/report
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang Pillow dan font
        run: |
          pip install pillow
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation

      - name: Proses inbox
        id: inbox
        run: |
          python agent.py inbox
          if [ -f "$REPORT_DIR/report_title.txt" ]; then echo "has_report=true" >> "$GITHUB_OUTPUT"; fi

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Slide baru dari inbox"
            git push || (git pull --rebase && git push)
          fi

      - name: Siapkan ZIP slide
        if: steps.inbox.outputs.has_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slide
          path: /tmp/report/latest
          retention-days: 30
          if-no-files-found: ignore

      - name: Beri tahu lewat Issue
        if: steps.inbox.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat "$REPORT_DIR/report_title.txt")" --body-file "$REPORT_DIR/report_body.md"
